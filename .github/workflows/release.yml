name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag 名稱(已存在的 tag,例 v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

# 同 tag 只允許一個 run 同時跑;新 trigger 自動取消舊的,避免 release asset 上傳衝突
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  # macOS arm64 / macOS x64 / Windows — tauri-action 標準流程
  release-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-13
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm install

      - name: Build & Release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: '智配通 面單列印 ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ## 安裝包

            | 平台 | 檔案 |
            |---|---|
            | macOS Apple Silicon (M1/M2/M3+) | `*_aarch64.dmg` |
            | macOS Intel | `*_x64.dmg` |
            | Windows x64 | `*_x64-setup.exe` (NSIS) 或 `*_x64_en-US.msi` |
            | Linux (Ubuntu 20.04 工控機) | `*-ubuntu-20.04.tar.gz`(含 webkit2gtk-4.1 + 主程式 + install.sh) |

            ## 首次啟動注意

            - **macOS**:本版未經 Apple Developer ID 簽章,首次開啟會被 Gatekeeper 攔下。
              請至「系統設定 → 隱私權與安全性 → 仍要開啟」放行。
            - **Windows**:首次開啟會看到 SmartScreen 警告,按「更多資訊 → 仍要執行」即可。
            - **Linux (Ubuntu 20.04)**:解壓 tarball 後 `sudo bash install.sh` 一次,
              會把 webkit2gtk-4.1 與主程式都裝起來。後續升級只換主程式 .deb。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: false
          # productName 含中文(智配通 面單列印)被 tauri-action upload sanitize 吃掉
          # 寫死 ASCII pattern,release asset 名乾淨;Finder / Dock 的 .app 仍中文(來自 bundle 內)
          assetNamePattern: 'cix3752iLabelPrint_[version]_[arch][_setup][ext]'

  # Ubuntu 20.04 工控機交付 — 獨立 job 用 ubuntu:20.04 container build
  # Tauri 2 hard-requires glib >= 2.70 + libsoup-3.0 + webkit2gtk-4.1
  # 全都不在 focal 套件源,自編 from jammy source
  # 流程:升 toolchain(GCC10/CMake/meson)→ 編 glib → 編 libsoup3 → 編 webkit → tauri build
  release-linux:
    runs-on: ubuntu-22.04
    continue-on-error: true  # source build 試錯中,fail 不阻 macOS/Windows release
    timeout-minutes: 300
    container:
      image: ubuntu:20.04
      options: --user root
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
      # 讓 pkg-config / linker 優先找 /usr/local(我們編的 glib 2.78 / libsoup3 / webkit2gtk-4.1)
      # 否則 Rust build 用系統 focal glib 2.64,缺 g_uri_error_quark 等新 symbol
      PKG_CONFIG_PATH: /usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
      LD_LIBRARY_PATH: /usr/local/lib/x86_64-linux-gnu:/usr/local/lib
      # RUNPATH 寫死 binary:client runtime 跳過 ld.so.cache 直接找 /usr/local 的 .so
      # (Ubuntu 22.04 有 system libwebkit2gtk-4.1 2.36 但 ABI 不兼容我們的 2.42)
      RUSTFLAGS: "-C link-arg=-Wl,-rpath,/usr/local/lib/x86_64-linux-gnu -C link-arg=-Wl,-rpath,/usr/local/lib"
    steps:
      - name: Bootstrap apt + 升級 toolchain (GCC 11 / CMake / meson)
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            curl wget gnupg ca-certificates lsb-release tzdata \
            software-properties-common
          # GCC 11 (webkit2gtk 2.42 OK)
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          # CMake 3.20+ from Kitware
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null \
            | gpg --dearmor -o /usr/share/keyrings/kitware.gpg
          echo "deb [signed-by=/usr/share/keyrings/kitware.gpg] https://apt.kitware.com/ubuntu/ focal main" \
            > /etc/apt/sources.list.d/kitware.list
          apt-get update
          apt-get install -y --no-install-recommends \
            git build-essential gcc-11 g++-11 cmake ninja-build \
            pkg-config python3 python3-pip python3-setuptools \
            xz-utils unzip patchelf file ruby gperf bison flex unifdef \
            libssl-dev libgtk-3-dev libxdo-dev librsvg2-dev \
            libayatana-appindicator3-dev \
            libffi-dev libpcre2-dev libmount-dev gettext zlib1g-dev \
            libnghttp2-dev libpsl-dev libsqlite3-dev libxml2-dev libxslt1-dev \
            libgcrypt20-dev libsystemd-dev libsecret-1-dev libtasn1-6-dev \
            liblcms2-dev libjpeg-dev libwebp-dev libopenjp2-7-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libenchant-2-dev libhyphen-dev libwoff-dev \
            libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libgbm-dev libdrm-dev libxt-dev libcups2-dev \
            libgudev-1.0-dev libnotify-dev libsoup2.4-dev
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-11
          pip3 install --upgrade pip
          pip3 install meson==1.3.2
          echo "===== toolchain versions ====="
          gcc --version | head -1
          cmake --version | head -1
          meson --version

      - name: Restore built upstream stack cache
        id: cache-stack
        uses: actions/cache/restore@v4
        with:
          path: /opt/cix-stack
          key: focal-upstream-stack-glib2.78-libsoup3.4-webkit2.42-v1

      - name: Build glib 2.78 from upstream tarball
        if: steps.cache-stack.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p /tmp/build /opt/cix-stack
          cd /tmp/build
          GLIB_VER=2.78.6
          echo "::group::glib download"
          wget -q "https://download.gnome.org/sources/glib/2.78/glib-${GLIB_VER}.tar.xz"
          tar xf "glib-${GLIB_VER}.tar.xz"
          echo "::endgroup::"
          cd "glib-${GLIB_VER}"
          echo "::group::glib meson_options.txt"
          cat meson_options.txt | head -60 || true
          echo "::endgroup::"
          echo "::group::glib meson setup"
          meson setup _build \
            --prefix=/usr/local \
            --buildtype=release \
            -Dtests=false \
            -Dlibmount=enabled 2>&1 | tail -50
          echo "::endgroup::"
          echo "::group::glib ninja (~5-10 min)"
          ninja -C _build 2>&1 | tail -50
          echo "::endgroup::"
          ninja -C _build install
          ldconfig
          DESTDIR=/opt/cix-stack/glib ninja -C _build install >/dev/null
          pkg-config --modversion glib-2.0

      - name: Build libsoup3 3.4 from upstream tarball
        if: steps.cache-stack.outputs.cache-hit != 'true'
        run: |
          set -e
          cd /tmp/build
          SOUP_VER=3.4.4
          echo "::group::libsoup3 download"
          wget -q "https://download.gnome.org/sources/libsoup/3.4/libsoup-${SOUP_VER}.tar.xz"
          tar xf "libsoup-${SOUP_VER}.tar.xz"
          echo "::endgroup::"
          cd "libsoup-${SOUP_VER}"
          echo "::group::libsoup3 meson setup"
          # tls_check=false:不檢查 glib-networking(focal 內建有,runtime 會找到)
          meson setup _build \
            --prefix=/usr/local \
            --buildtype=release \
            -Dtests=false -Dvapi=disabled -Ddocs=disabled \
            -Dgssapi=disabled -Dsysprof=disabled -Dintrospection=disabled \
            -Dpkcs11_tests=disabled -Dautobahn=disabled \
            -Dntlm=disabled -Dbrotli=disabled \
            -Dtls_check=false 2>&1 | tail -40
          echo "::endgroup::"
          echo "::group::libsoup3 ninja (~3-5 min)"
          ninja -C _build 2>&1 | tail -40
          echo "::endgroup::"
          ninja -C _build install
          ldconfig
          DESTDIR=/opt/cix-stack/libsoup3 ninja -C _build install >/dev/null
          pkg-config --modversion libsoup-3.0

      - name: Build webkit2gtk-4.1 from upstream tarball (1-2 hr)
        if: steps.cache-stack.outputs.cache-hit != 'true'
        run: |
          set -e
          cd /tmp/build
          WK_VER=2.42.5
          echo "::group::webkit2gtk download"
          wget -q "https://webkitgtk.org/releases/webkitgtk-${WK_VER}.tar.xz"
          tar xf "webkitgtk-${WK_VER}.tar.xz"
          echo "::endgroup::"
          cd "webkitgtk-${WK_VER}"
          mkdir -p _build
          cd _build
          echo "::group::webkit2gtk cmake (GTK3 + libsoup3 port,disable many features)"
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DPORT=GTK \
            -DUSE_SOUP2=OFF \
            -DUSE_GTK4=OFF \
            -DENABLE_DOCUMENTATION=OFF \
            -DENABLE_INTROSPECTION=OFF \
            -DENABLE_MINIBROWSER=OFF \
            -DUSE_SYSTEMD=OFF \
            -DENABLE_BUBBLEWRAP_SANDBOX=OFF \
            -DENABLE_JOURNALD_LOG=OFF \
            -DENABLE_GAMEPAD=OFF \
            -DUSE_LIBBACKTRACE=OFF \
            -DENABLE_WAYLAND_TARGET=OFF \
            -DENABLE_X11_TARGET=ON \
            -DUSE_JPEGXL=OFF \
            -DUSE_AVIF=OFF \
            -DENABLE_WEB_AUDIO=OFF \
            -DENABLE_VIDEO=OFF \
            -DENABLE_MEDIA_STREAM=OFF \
            .. 2>&1 | tail -60
          echo "::endgroup::"
          echo "::group::webkit2gtk ninja (1-2 hr)"
          ninja 2>&1 | tail -80
          echo "::endgroup::"
          ninja install
          ldconfig
          DESTDIR=/opt/cix-stack/webkit ninja install >/dev/null
          pkg-config --modversion webkit2gtk-4.1

      - name: Cache hit — restore from /opt/cix-stack into /usr/local
        if: steps.cache-stack.outputs.cache-hit == 'true'
        run: |
          for d in glib libsoup3 webkit; do
            if [ -d /opt/cix-stack/$d ]; then
              cp -a /opt/cix-stack/$d/usr/local/. /usr/local/ 2>/dev/null || true
            fi
          done
          ldconfig
          pkg-config --modversion glib-2.0
          pkg-config --modversion libsoup-3.0
          pkg-config --modversion webkit2gtk-4.1

      # 強制 save:即使 Tauri build / packaging 後續 fail,webkit 編好的成果也保住
      - name: Save built upstream stack cache (always)
        if: always() && steps.cache-stack.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/cix-stack
          key: focal-upstream-stack-glib2.78-libsoup3.4-webkit2.42-v1

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Node 20
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - uses: actions/checkout@v4

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm install

      # 系統 focal 套件還是 link 到 /usr/lib glib 2.64(linker -L 順序系統路徑在前)
      # 直接用 /usr/local 編好的覆蓋系統 .so,讓 -lglib-2.0 等找到新版
      - name: Override system glib/soup/webkit with /usr/local
        run: |
          for lib in libglib-2.0 libgobject-2.0 libgio-2.0 libgmodule-2.0 libgthread-2.0 \
                     libsoup-3.0 libjavascriptcoregtk-4.1 libwebkit2gtk-4.1; do
            for f in /usr/local/lib/x86_64-linux-gnu/${lib}.so* /usr/local/lib/${lib}.so*; do
              [ -e "$f" ] && cp -fP "$f" /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
            done
          done
          ldconfig
          echo "===系統 glib 版本(應為 2.78)==="
          ls -l /usr/lib/x86_64-linux-gnu/libglib-2.0.so* | head -5

      - name: Tauri build .deb
        run: npm run tauri:build -- --bundles deb

      # Tauri 用 productName(中文)當 .deb Package 名,違反 Debian 規範(只允許小寫
      # 字母 / 數字 / + - .)導致 dpkg -i 拒絕安裝。手動改 control 內 Package 為 ASCII
      - name: Rewrite .deb Package name to ASCII
        run: |
          set -e
          DEB_DIR=src-tauri/target/release/bundle/deb
          ORIG_DEB=$(ls "$DEB_DIR"/*.deb | head -1)
          echo "原始 .deb: $ORIG_DEB"
          WORK=/tmp/deb-fix
          rm -rf "$WORK"
          dpkg-deb -R "$ORIG_DEB" "$WORK"
          echo "=== 原 control ==="
          cat "$WORK/DEBIAN/control"
          sed -i 's/^Package:.*/Package: cix3752i-label-print/' "$WORK/DEBIAN/control"
          # 整行替換 Depends(我們 tarball 自帶 webkit2gtk-4.1,focal 系統沒此套件,
          # apt-get install -f 找不到會把主程式移除)
          sed -i 's/^Depends:.*/Depends: libgtk-3-0/' "$WORK/DEBIAN/control"
          echo "=== 新 control ==="
          cat "$WORK/DEBIAN/control"
          NEW_DEB="$DEB_DIR/cix3752i-label-print_0.1.0_amd64.deb"
          rm -f "$ORIG_DEB"
          dpkg-deb -b "$WORK" "$NEW_DEB"
          ls -lh "$DEB_DIR"

      - name: Package tarball (stack libs + 主程式 .deb + install.sh)
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          VERSION="${TAG_NAME#v}"
          STAGE_NAME="cix3752iLabelPrint-${VERSION}-ubuntu-20.04"
          STAGE="/tmp/${STAGE_NAME}"
          mkdir -p "$STAGE/stack/usr/local"

          # 合併 /opt/cix-stack/{glib,libsoup3,webkit}/usr/local → STAGE/stack/usr/local
          # (DESTDIR=/opt/cix-stack/X 安裝時各自把 /usr/local 寫進)
          for src in /opt/cix-stack/glib /opt/cix-stack/libsoup3 /opt/cix-stack/webkit; do
            if [ -d "$src/usr/local" ]; then
              cp -a "$src/usr/local/." "$STAGE/stack/usr/local/"
            fi
          done
          # 從 build container 額外 ship 12+ runtime .so + libstdc++(GCC11 版,
          # focal client 預設 libstdc++ 太舊缺 GLIBCXX_3.4.29)
          # 這些 lib 系統 webkit2gtk runtime 必要;每個 cp 真實檔(含版本後綴的 .so.N.N.N)
          mkdir -p "$STAGE/stack/usr/local/lib/x86_64-linux-gnu"
          for pattern in \
              libxslt.so.1* libwoff2dec.so.1* libharfbuzz-icu.so.0* libopenjp2.so.7* \
              libwebpdemux.so.2* libenchant-2.so.2* libsecret-1.so.0* libhyphen.so.0* \
              libgbm.so.1* libdrm.so.2* libnghttp2.so.14* libatomic.so.1* \
              libstdc++.so.6*; do
            for f in /usr/lib/x86_64-linux-gnu/$pattern /usr/lib/gcc/x86_64-linux-gnu/11/$pattern; do
              [ -e "$f" ] && cp -P "$f" "$STAGE/stack/usr/local/lib/x86_64-linux-gnu/" 2>/dev/null || true
            done
          done

          du -sh "$STAGE/stack" || true
          # sanity:預期看到 libwebkit2gtk-4.1.so* 與一票 runtime 依賴
          echo "=== sanity:核心 .so ==="
          ls "$STAGE/stack/usr/local/lib/x86_64-linux-gnu/" | grep -E "libwebkit2gtk-4\.1|libsoup-3\.0|libstdc\+\+|libxslt|libgbm" | head

          # 主程式 .deb(Tauri build 出來)
          cp src-tauri/target/release/bundle/deb/*.deb "$STAGE/"
          ls "$STAGE/"

          # install.sh:複製 stack 到 /usr/local + ldconfig + dpkg -i 主程式
          cat > "$STAGE/install.sh" <<'INSTALL_EOF'
          #!/bin/bash
          set -e
          cd "$(dirname "$0")"

          echo "=== 智配通 面單列印 — Ubuntu 20.04 安裝 ==="
          echo ""
          echo "1/3 複製 webkit2gtk-4.1 / libsoup3 / glib 2.78 → /usr/local"
          if [ -d stack/usr/local ]; then
            sudo cp -a stack/usr/local/. /usr/local/
          fi

          echo "2/3 更新 dynamic linker cache"
          # 00- 前綴讓字母順序排在 /etc/ld.so.conf.d 內系統 conf 之前,
          # 確保 ldconfig 優先索引 /usr/local 的 .so(而非 Ubuntu 22.04 的 system libwebkit2gtk-4.1)
          # 含 multiarch 子目錄(x86_64-linux-gnu),否則 .so 不會被 cache
          sudo tee /etc/ld.so.conf.d/00-cix3752iLabelPrint.conf > /dev/null <<'LDCONF'
          /usr/local/lib/x86_64-linux-gnu
          /usr/local/lib
          LDCONF
          sudo ldconfig

          echo "3/3 安裝主程式 .deb"
          sudo dpkg -i *.deb || sudo apt-get install -f -y

          echo ""
          echo "=== 完成 ==="
          echo "從應用選單開啟「智配通 面單列印」,或於 terminal 執行:cix3752i-label-print"
          INSTALL_EOF
          chmod +x "$STAGE/install.sh"

          # README
          cat > "$STAGE/README.txt" <<'README_EOF'
          智配通 面單列印 — Ubuntu 20.04 安裝包
          =====================================

          內含:
            - stack/usr/local/         自編的 glib 2.78 + libsoup3 + webkit2gtk-4.1
                                       (Ubuntu 20.04 套件源無此版本,我們從 source build)
            - 主程式 .deb              cix3752i-label-print
            - install.sh

          安裝:
            sudo bash install.sh

          後續升級:
            只需 sudo dpkg -i <新版主程式.deb>(webkit 已在系統內,不必重裝)
          README_EOF

          # 打 tarball
          cd /tmp
          tar czf "${STAGE_NAME}.tar.gz" "${STAGE_NAME}"
          ls -lh "${STAGE_NAME}.tar.gz"

          echo "TARBALL=/tmp/${STAGE_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload tarball to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ env.TARBALL }}
          draft: true
