name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag 名稱(已存在的 tag,例 v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  # macOS arm64 / macOS x64 / Windows — tauri-action 標準流程
  release-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-13
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm install

      - name: Build & Release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '智配通 面單列印 ${{ github.ref_name }}'
          releaseBody: |
            ## 安裝包

            | 平台 | 檔案 |
            |---|---|
            | macOS Apple Silicon (M1/M2/M3+) | `*_aarch64.dmg` |
            | macOS Intel | `*_x64.dmg` |
            | Windows x64 | `*_x64-setup.exe` (NSIS) 或 `*_x64_en-US.msi` |
            | Linux (Ubuntu 20.04 工控機) | `*-ubuntu-20.04.tar.gz`(含 webkit2gtk-4.1 + 主程式 + install.sh) |

            ## 首次啟動注意

            - **macOS**:本版未經 Apple Developer ID 簽章,首次開啟會被 Gatekeeper 攔下。
              請至「系統設定 → 隱私權與安全性 → 仍要開啟」放行。
            - **Windows**:首次開啟會看到 SmartScreen 警告,按「更多資訊 → 仍要執行」即可。
            - **Linux (Ubuntu 20.04)**:解壓 tarball 後 `sudo bash install.sh` 一次,
              會把 webkit2gtk-4.1 與主程式都裝起來。後續升級只換主程式 .deb。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: false

  # Ubuntu 20.04 工控機交付 — 獨立 job 用 ubuntu:20.04 container build,
  # 確保 binary link 到 glibc 2.31,工控機才跑得起來
  # Tauri 2 要求 webkit2gtk-4.1 + libsoup-3.0 都不在 focal 套件源,自編 from jammy source
  release-linux:
    runs-on: ubuntu-22.04
    continue-on-error: true  # source build 試錯中,fail 不阻 macOS/Windows release
    container:
      image: ubuntu:20.04
      options: --user root
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Install base build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl wget git ca-certificates gnupg lsb-release \
            software-properties-common dpkg-dev devscripts fakeroot \
            build-essential pkg-config \
            libssl-dev libgtk-3-dev libxdo-dev librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf file

      - name: Add jammy deb-src(取 webkit2gtk-4.1 / libsoup3 source 用)
        run: |
          cat > /etc/apt/sources.list.d/jammy-src.list <<'EOF'
          deb-src http://archive.ubuntu.com/ubuntu jammy main universe
          deb-src http://archive.ubuntu.com/ubuntu jammy-updates main universe
          EOF
          apt-get update

      - name: Cache built webkit2gtk-4.1 + libsoup3 .deb
        id: cache-webkit
        uses: actions/cache@v4
        with:
          path: /tmp/webkit-debs
          key: focal-built-webkit2gtk-4.1-libsoup3-v1

      - name: Build libsoup3 from jammy source
        if: steps.cache-webkit.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/build /tmp/webkit-debs
          cd /tmp/build
          echo "===== libsoup3: source pull ====="
          apt-get source libsoup3 || apt-get source libsoup-3.0
          ls -d libsoup* | head -5

          SRC_DIR=$(find . -maxdepth 1 -type d -name "libsoup*" | head -1)
          cd "$SRC_DIR"

          echo "===== libsoup3: Build-Depends ====="
          grep -A 50 "^Build-Depends" debian/control | head -50

          echo "===== libsoup3: build-dep install ====="
          apt-get build-dep -y . 2>&1 | tail -30 || echo "WARN: some build deps missing"

          echo "===== libsoup3: dpkg-buildpackage ====="
          dpkg-buildpackage -b -uc -us -j$(nproc) 2>&1 | tail -40 || echo "WARN: build failed"

          cd ..
          ls *.deb 2>/dev/null | head
          cp *.deb /tmp/webkit-debs/ 2>/dev/null || echo "WARN: no .deb produced"

      - name: Build webkit2gtk-4.1 from jammy source
        if: steps.cache-webkit.outputs.cache-hit != 'true'
        run: |
          cd /tmp/build

          echo "===== install libsoup3 first(webkit deps on it)====="
          dpkg -i /tmp/webkit-debs/*soup*.deb 2>&1 | tail -10 || apt-get install -f -y

          echo "===== webkit2gtk: source pull ====="
          apt-get source webkit2gtk
          ls -d webkit2gtk* | head -5

          SRC_DIR=$(find . -maxdepth 1 -type d -name "webkit2gtk*" | head -1)
          cd "$SRC_DIR"

          echo "===== webkit2gtk: Build-Depends ====="
          grep -A 80 "^Build-Depends" debian/control | head -80

          echo "===== webkit2gtk: build-dep install ====="
          apt-get build-dep -y . 2>&1 | tail -40 || echo "WARN: some build deps missing"

          echo "===== webkit2gtk: dpkg-buildpackage(1-2 小時,首次 build)====="
          dpkg-buildpackage -b -uc -us -j$(nproc) 2>&1 | tail -60 || echo "WARN: build failed"

          cd ..
          ls *.deb 2>/dev/null | head
          cp libwebkit2gtk-4.1*.deb libjavascriptcoregtk-4.1*.deb gir1.2-webkit2-4.1*.deb gir1.2-javascriptcoregtk-4.1*.deb /tmp/webkit-debs/ 2>/dev/null || echo "WARN: missing some .deb"

      - name: Install built webkit2gtk-4.1 + libsoup3
        run: |
          echo "===== /tmp/webkit-debs contents ====="
          ls -lh /tmp/webkit-debs/
          dpkg -i /tmp/webkit-debs/*.deb 2>&1 | tail -20 || apt-get install -f -y
          echo "===== verify pkg-config ====="
          pkg-config --modversion webkit2gtk-4.1 || echo "webkit2gtk-4.1 still not installed"
          pkg-config --modversion libsoup-3.0 || echo "libsoup-3.0 still not installed"

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Node 20
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - uses: actions/checkout@v4

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm install

      - name: Tauri build .deb
        run: npm run tauri:build -- --bundles deb

      - name: Collect webkit2gtk-4.1 .deb (從本機 cache 撈出來打進 tarball)
        run: |
          mkdir -p /tmp/webkit-debs
          cd /tmp/webkit-debs
          # 從本機 apt cache 找 webkit 相關 .deb;沒有就用 apt download
          for pkg in libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 \
                     gir1.2-webkit2-4.1 gir1.2-javascriptcoregtk-4.1; do
            apt-get download "$pkg" 2>/dev/null || echo "warn: $pkg not downloadable"
          done
          ls -lh /tmp/webkit-debs/

      - name: Package tarball (webkit2gtk + 主程式 + install.sh)
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE_NAME="cix3752iLabelPrint-${VERSION}-ubuntu-20.04"
          STAGE="/tmp/${STAGE_NAME}"
          mkdir -p "$STAGE"

          # webkit2gtk-4.1 系列 .deb
          cp /tmp/webkit-debs/*.deb "$STAGE/" 2>/dev/null || true

          # 主程式 .deb(Tauri build 出來)
          cp src-tauri/target/release/bundle/deb/*.deb "$STAGE/"

          # install.sh
          cat > "$STAGE/install.sh" <<'INSTALL_EOF'
          #!/bin/bash
          set -e
          cd "$(dirname "$0")"

          echo "=== 智配通 面單列印 — Ubuntu 20.04 安裝 ==="
          echo ""
          echo "1/2 安裝 webkit2gtk-4.1 系列套件(Ubuntu 20.04 預設沒有)"
          # 先裝 javascriptcoregtk(webkit2gtk 依賴它)
          sudo dpkg -i libjavascriptcoregtk-4.1-*.deb 2>/dev/null || true
          sudo dpkg -i gir1.2-javascriptcoregtk-4.1*.deb 2>/dev/null || true
          sudo dpkg -i libwebkit2gtk-4.1-*.deb 2>/dev/null || true
          sudo dpkg -i gir1.2-webkit2-4.1*.deb 2>/dev/null || true
          sudo apt-get install -f -y

          echo ""
          echo "2/2 安裝主程式"
          # 主程式 .deb 檔名因 Tauri 版本不同,glob 抓所有非 webkit 的
          for deb in *.deb; do
            case "$deb" in
              libwebkit2gtk-4.1-*|libjavascriptcoregtk-4.1-*|gir1.2-webkit2-4.1*|gir1.2-javascriptcoregtk-4.1*)
                ;;
              *)
                sudo dpkg -i "$deb"
                ;;
            esac
          done
          sudo apt-get install -f -y

          echo ""
          echo "=== 完成 ==="
          echo "從應用選單開啟「智配通 面單列印」,或於 terminal 執行:cix3752i-label-print"
          INSTALL_EOF
          chmod +x "$STAGE/install.sh"

          # README
          cat > "$STAGE/README.txt" <<'README_EOF'
          智配通 面單列印 — Ubuntu 20.04 安裝包
          =====================================

          內含:
            - libwebkit2gtk-4.1-*.deb  (Tauri 2 必要,Ubuntu 20.04 預設無)
            - libjavascriptcoregtk-4.1-*.deb
            - gir1.2-* .deb
            - 智配通 面單列印 主程式 .deb
            - install.sh

          安裝:
            sudo bash install.sh

          後續升級:
            只需 sudo dpkg -i <新版主程式.deb>(webkit 已在系統內,不必重裝)
          README_EOF

          # 打 tarball
          cd /tmp
          tar czf "${STAGE_NAME}.tar.gz" "${STAGE_NAME}"
          ls -lh "${STAGE_NAME}.tar.gz"

          echo "TARBALL=/tmp/${STAGE_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload tarball to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.TARBALL }}
          draft: true
