name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag 名稱(已存在的 tag,例 v0.1.0)'
        required: true
        default: 'v0.1.0'
      only:
        description: '只跑指定 job(all / linux / desktop)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - desktop

permissions:
  contents: write

# 同 tag 只允許一個 run 同時跑;新 trigger 自動取消舊的,避免 release asset 上傳衝突
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  # 統一建立 release 的前置 job —— 修 v0.17.1 實際炸出的重複 draft release 問題。
  # 根因:release-desktop(tauri-action)與 release-linux(原本用 softprops/action-gh-release)
  # 各自都是「查無該 tag 的 release 就自己建一個」,兩者幾乎同時起跑、互相看不到對方剛建的
  # release(TOCTOU),於是各建一份同 tag 的 draft(v0.17.1 實測 id 367648071 與 367648069;
  # v0.17.0 只出現一個是純屬時序運氣,不代表沒這個問題)。
  # 改成只有這個 job 會建立 release,desktop / linux 都改用它輸出的 release id 上傳 asset,
  # 從源頭消滅「兩邊都建」的可能性,而不是靠鎖或重試去降低發生機率。
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          bash scripts/build-release-notes.sh "${{ github.event.inputs.tag || github.ref_name }}" > /tmp/release-notes.md

      # 找同 tag 的既有 release(含 draft),找到就沿用同一個 id 讓重跑 workflow 具備幂等性
      # (人工重跑失敗的 job 不會又多建一個);找不到才新建一份 draft。
      #
      # 不能用 GET /repos/{owner}/{repo}/releases/tags/{tag} 定位 —— 這支 API 查不到 draft
      # release(draft 沒有真正指到 tag 的 ref,GitHub 底層就是靠 tag ref 反查 release),draft
      # 只能整批 list 出來自己找 tag_name。--paginate 撈完所有頁,避免 release 數一多漏找到。
      - name: Find existing release or create one
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # 一定要 pipefail:光 set -e 不會讓 pipeline 中間的指令失敗擋下整段 ——
          # 上游 gh api 若剛好 5xx / rate-limit,`gh api | jq` 這條 pipeline 的退出碼只看
          # 最後一節(jq),jq 讀到空輸入照樣成功、RELEASE_ID 取到空字串,就會被誤判成
          # 「沒有既有 release」而重新建立一個 —— 等於這次修的重複 draft 問題換個觸發路徑再犯一次。
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/releases" | jq -s 'add' > /tmp/releases.json
          # 原本 `jq ... | head -1` 在 pipefail 下有 SIGPIPE 風險(head 讀到第一筆就關閉管線,
          # 前面的 jq 可能因為寫入端斷開而被判定失敗),改成單一 jq filter 直接取第一筆,不再接 head。
          RELEASE_ID=$(jq -r --arg tag "$TAG_NAME" 'first(.[] | select(.tag_name == $tag) | .id) // empty' /tmp/releases.json)

          # 找到既有 release 就只沿用 id,刻意不順便把上面重新產生的 notes 蓋回去 body ——
          # CLAUDE.md 發版流程第 5 步允許「已發佈版本才發現 notes 漏寫」時直接
          # `gh release edit --notes-file` 手動補救;若這裡順手覆寫 body,等於每次重跑
          # workflow(例如某個 job 失敗後重跑)都會把人工修正的 notes 蓋回腳本產出的版本,
          # 悄悄吃掉那次人工修正。要更新說明就直接 `gh release edit`,不要靠重跑這個 workflow。
          if [ -n "$RELEASE_ID" ]; then
            echo "找到既有 release id=$RELEASE_ID(tag=$TAG_NAME),沿用同一個,不重複建立"
          else
            echo "找不到 tag $TAG_NAME 的 release,建立新的 draft"
            RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
              -X POST \
              -f tag_name="$TAG_NAME" \
              -f name="智配通 面單列印 $TAG_NAME" \
              -F draft=true \
              -F prerelease=false \
              -F body=@/tmp/release-notes.md \
              --jq '.id')
            echo "已建立 release id=$RELEASE_ID"
          fi

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  # macOS arm64 / macOS x64 / Windows — tauri-action 標準流程
  release-desktop:
    # workflow_dispatch 指定 only=linux 時跳過(避免重 build 撞 assets already_exists)
    # push tag 觸發時 inputs.only 為空字串,!= 'linux' 為 true,正常跑
    if: github.event.inputs.only != 'linux'
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}
    # 60 分鐘上限:macOS arm64 / Windows ~20-30 min;不跑 macOS Intel,Intel Mac 用戶請走 Rosetta 2 跑 arm64 build
    # (排隊本身不算 timeout;timeout 從 job 真正開始跑算起。配 fail-fast:false,單個 matrix item 卡也不影響其他)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --frozen-lockfile:lock 與 package.json 不一致時當場 fail,而非默默改寫 lock。
      # 沒有它,版控 yarn.lock 起不到「可重現建置」的作用 —— 發版產物可能與 repo 內的 lock 不同版。
      - name: Install npm deps
        run: yarn install --frozen-lockfile

      # release 本身已由前置的 create-release job 統一建立,這裡不再需要靠這份 notes 去建立
      # release —— 但仍要重新產生一份:tauri-action 走 releaseId 模式時,依然會把 releaseBody
      # 塞進 latest.json 的 notes 欄位(見下方 tauri-action 那步的說明),沒有它「發現新版本」
      # 對話框的更新說明會整個消失。shell: bash 讓 Windows runner 也能跑(git-bash)
      - name: Build release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            bash scripts/build-release-notes.sh "${{ github.event.inputs.tag || github.ref_name }}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — Tauri 內建,只要 env 有設就會 sign 並產 latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS codesign + notarize — 讓 .app/.dmg 過 Gatekeeper,別台 Mac 下載即開(不再「已損毀」)
          # 這 6 個 secret 沒設時注入空字串,tauri-action 自動跳過簽章、退回 ad-hoc(等同現狀,不會 fail)
          # Windows runner 也會拿到這些 env,但 APPLE_* 對 Windows build 無作用,無害
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # release 由前置的 create-release job 統一建立(見該 job 開頭註解),這裡改用
          # releaseId 指定上傳目標,不再走 tauri-action 自己「查無 tag 就建立」那條路
          # (那正是造成重複 draft 的根因)。
          #
          # tagName / releaseBody 仍要保留 —— 讀過 tauri-action v0 原始碼
          # (src/index.ts + src/upload-version-json.ts,非憑印象猜測)確認:即使走
          # releaseId 這條路徑,tauri-action 產生 updater 用的 latest.json 時仍會用
          # tagName 組資產下載網址、用 releaseBody 當 notes 欄位;拿掉會讓 App 內
          # 「發現新版本」對話框的更新說明整個消失。releaseName / releaseDraft 才是真的
          # 只有「查無 tag 自建 release」那條路徑會用到,現在該路徑不會被觸發,拿掉沒影響。
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          # productName 含中文(智配通 面單列印)被 tauri-action upload sanitize 吃掉
          # 寫死 ASCII pattern,release asset 名乾淨;Finder / Dock 的 .app 仍中文(來自 bundle 內)
          assetNamePattern: 'cix3752iLabelPrint_[version]_[arch][_setup][ext]'

  # Linux 多版本 tarball — matrix 跑 Ubuntu 20.04 / 22.04 / 24.04 三個 container
  # 20.04:focal 無 webkit2gtk-4.1,自編 glib 2.78 + libsoup3 + webkit2gtk-4.1 整套
  # 22.04 / 24.04:系統有 libwebkit2gtk-4.1-0,直接 link 系統 .so,install.sh 跑 apt
  release-linux:
    if: github.event.inputs.only != 'desktop'
    needs: create-release
    runs-on: ubuntu-22.04
    continue-on-error: true  # source build / 新 distro 試錯中,fail 不阻其他 matrix
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-20.04
            image: ubuntu:20.04
            source_build: true
            deb_depends: 'libgtk-3-0, libayatana-appindicator3-1'
          - distro: ubuntu-22.04
            image: ubuntu:22.04
            source_build: false
            deb_depends: 'libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1'
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            source_build: false
            deb_depends: 'libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1'
    container:
      image: ${{ matrix.image }}
      options: --user root
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
      # 讓 pkg-config / linker 優先找 /usr/local(20.04 自編 stack 用;22.04+ 不影響系統 lib)
      PKG_CONFIG_PATH: /usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
      LD_LIBRARY_PATH: /usr/local/lib/x86_64-linux-gnu:/usr/local/lib
      # RUNPATH 寫進 binary;client runtime 跳過 ld.so.cache 直接找 /usr/local
      # 22.04 上系統 libwebkit2gtk-4.1 與我們無干涉(/usr/local 空,fallback 走 /usr/lib)
      RUSTFLAGS: "-C link-arg=-Wl,-rpath,/usr/local/lib/x86_64-linux-gnu -C link-arg=-Wl,-rpath,/usr/local/lib"
    steps:
      - name: Bootstrap apt (20.04 — source build webkit toolchain)
        if: matrix.distro == 'ubuntu-20.04'
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            curl wget gnupg ca-certificates lsb-release tzdata \
            software-properties-common
          # GCC 11 (webkit2gtk 2.42 OK) — 手動加 ubuntu-toolchain-r/test PPA。
          # 不用 add-apt-repository:focal 版會把 Launchpad API 回應錯拆成
          # 'ppa:~ubuntu-toolchain-r/ubuntu/test' 而找不到 PPA(持續性失敗,非偶發)。
          # 金鑰改用 curl 走 HTTPS 從 keyserver web 介面取,繞過會 flake 的 dirmngr/--recv-keys。
          mkdir -p /usr/share/keyrings
          curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x60C317803A41BA51845E371A1E9377A2BA9EF27F" \
            | gpg --dearmor -o /usr/share/keyrings/ubuntu-toolchain-r.gpg
          echo "deb [signed-by=/usr/share/keyrings/ubuntu-toolchain-r.gpg] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu focal main" \
            > /etc/apt/sources.list.d/ubuntu-toolchain-r.list
          # CMake 3.20+ from Kitware(focal 內建僅 3.16,webkit2gtk 2.42 需 3.20+)
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null \
            | gpg --dearmor -o /usr/share/keyrings/kitware.gpg
          echo "deb [signed-by=/usr/share/keyrings/kitware.gpg] https://apt.kitware.com/ubuntu/ focal main" \
            > /etc/apt/sources.list.d/kitware.list
          # ⚠️ 必須釘在 3.31.x:WebKitGTK 2.42.5 不相容 CMake 4.x —— 4.x 下 WebKitMacros.cmake
          # 的 _WEBKIT_TARGET_LINK_FRAMEWORK 會 "Unknown arguments specified" 而 configure 失敗
          # (JavaScriptCore/CMakeLists.txt:431)。Kitware 倉庫滾動更新,不釘版本就會隨時間漂到 4.x;
          # 本問題長期被 stack 快取掩蓋,直到 v0.16.0 快取過期重編才暴露。
          # 若日後要升 CMake,必須同步升 webkit2gtk 版本並確認相容。
          printf 'Package: cmake cmake-data\nPin: version 3.31.*\nPin-Priority: 1001\n' \
            > /etc/apt/preferences.d/cmake-pin
          apt-get update
          apt-get install -y --no-install-recommends \
            git build-essential gcc-11 g++-11 cmake ninja-build \
            clang libclang-dev \
            pkg-config python3 python3-pip python3-setuptools \
            xz-utils unzip patchelf file ruby gperf bison flex unifdef \
            libssl-dev libgtk-3-dev libxdo-dev librsvg2-dev \
            libayatana-appindicator3-dev \
            libffi-dev libpcre2-dev libmount-dev gettext zlib1g-dev \
            libnghttp2-dev libpsl-dev libsqlite3-dev libxml2-dev libxslt1-dev \
            libgcrypt20-dev libsystemd-dev libsecret-1-dev libtasn1-6-dev \
            liblcms2-dev libjpeg-dev libwebp-dev libopenjp2-7-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            libenchant-2-dev libhyphen-dev libwoff-dev \
            libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libgbm-dev libdrm-dev libxt-dev libcups2-dev \
            libgudev-1.0-dev libnotify-dev libsoup2.4-dev
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-11
          pip3 install --upgrade pip
          pip3 install meson==1.3.2
          echo "===== toolchain versions ====="
          gcc --version | head -1
          cmake --version | head -1
          meson --version
          # fail fast:pin 若失效(Kitware 移除 3.31.x 等),在此當場擋下。
          # 否則要等 webkit configure 才爆,白跑前面 glib/libsoup 的十幾分鐘。
          cmake --version | head -1 | grep -qE 'version 3\.' || {
            echo "::error::CMake 必須是 3.x(webkit2gtk 2.42.5 不相容 4.x),實際為 $(cmake --version | head -1)"
            exit 1
          }

      - name: Bootstrap apt (22.04 / 24.04 — system webkit2gtk-4.1)
        if: matrix.distro != 'ubuntu-20.04'
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends \
            curl wget ca-certificates lsb-release tzdata \
            git build-essential pkg-config patchelf file xz-utils unzip \
            clang libclang-dev \
            libssl-dev libgtk-3-dev libxdo-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev libcups2-dev
          echo "===== toolchain / webkit 版本 ====="
          gcc --version | head -1
          pkg-config --modversion webkit2gtk-4.1 || true
          pkg-config --modversion libsoup-3.0 || true
          pkg-config --modversion glib-2.0 || true

      - name: Restore built upstream stack cache (20.04 only)
        if: matrix.distro == 'ubuntu-20.04'
        id: cache-stack
        uses: actions/cache/restore@v5
        with:
          path: /opt/cix-stack
          key: focal-upstream-stack-glib2.78-libsoup3.4-webkit2.42-v1

      - name: Build glib 2.78 from upstream tarball (20.04 only)
        if: matrix.distro == 'ubuntu-20.04' && steps.cache-stack.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p /tmp/build /opt/cix-stack
          cd /tmp/build
          GLIB_VER=2.78.6
          echo "::group::glib download"
          wget -q "https://download.gnome.org/sources/glib/2.78/glib-${GLIB_VER}.tar.xz"
          tar xf "glib-${GLIB_VER}.tar.xz"
          echo "::endgroup::"
          cd "glib-${GLIB_VER}"
          echo "::group::glib meson setup"
          meson setup _build \
            --prefix=/usr/local \
            --buildtype=release \
            -Dtests=false \
            -Dlibmount=enabled 2>&1 | tail -50
          echo "::endgroup::"
          echo "::group::glib ninja (~5-10 min)"
          ninja -C _build 2>&1 | tail -50
          echo "::endgroup::"
          ninja -C _build install
          ldconfig
          DESTDIR=/opt/cix-stack/glib ninja -C _build install >/dev/null
          pkg-config --modversion glib-2.0

      - name: Build libsoup3 3.4 from upstream tarball (20.04 only)
        if: matrix.distro == 'ubuntu-20.04' && steps.cache-stack.outputs.cache-hit != 'true'
        run: |
          set -e
          cd /tmp/build
          SOUP_VER=3.4.4
          echo "::group::libsoup3 download"
          wget -q "https://download.gnome.org/sources/libsoup/3.4/libsoup-${SOUP_VER}.tar.xz"
          tar xf "libsoup-${SOUP_VER}.tar.xz"
          echo "::endgroup::"
          cd "libsoup-${SOUP_VER}"
          echo "::group::libsoup3 meson setup"
          meson setup _build \
            --prefix=/usr/local \
            --buildtype=release \
            -Dtests=false -Dvapi=disabled -Ddocs=disabled \
            -Dgssapi=disabled -Dsysprof=disabled -Dintrospection=disabled \
            -Dpkcs11_tests=disabled -Dautobahn=disabled \
            -Dntlm=disabled -Dbrotli=disabled \
            -Dtls_check=false 2>&1 | tail -40
          echo "::endgroup::"
          echo "::group::libsoup3 ninja (~3-5 min)"
          ninja -C _build 2>&1 | tail -40
          echo "::endgroup::"
          ninja -C _build install
          ldconfig
          DESTDIR=/opt/cix-stack/libsoup3 ninja -C _build install >/dev/null
          pkg-config --modversion libsoup-3.0

      - name: Build webkit2gtk-4.1 from upstream tarball (20.04 only, 1-2 hr)
        id: build-webkit
        if: matrix.distro == 'ubuntu-20.04' && steps.cache-stack.outputs.cache-hit != 'true'
        run: |
          set -e
          cd /tmp/build
          WK_VER=2.42.5
          echo "::group::webkit2gtk download"
          wget -q "https://webkitgtk.org/releases/webkitgtk-${WK_VER}.tar.xz"
          tar xf "webkitgtk-${WK_VER}.tar.xz"
          echo "::endgroup::"
          cd "webkitgtk-${WK_VER}"
          mkdir -p _build
          cd _build
          echo "::group::webkit2gtk cmake (GTK3 + libsoup3 port,disable many features)"
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DPORT=GTK \
            -DUSE_SOUP2=OFF \
            -DUSE_GTK4=OFF \
            -DENABLE_DOCUMENTATION=OFF \
            -DENABLE_INTROSPECTION=OFF \
            -DENABLE_MINIBROWSER=OFF \
            -DUSE_SYSTEMD=OFF \
            -DENABLE_BUBBLEWRAP_SANDBOX=OFF \
            -DENABLE_JOURNALD_LOG=OFF \
            -DENABLE_GAMEPAD=OFF \
            -DUSE_LIBBACKTRACE=OFF \
            -DENABLE_WAYLAND_TARGET=OFF \
            -DENABLE_X11_TARGET=ON \
            -DUSE_JPEGXL=OFF \
            -DUSE_AVIF=OFF \
            -DENABLE_WEB_AUDIO=OFF \
            -DENABLE_VIDEO=OFF \
            -DENABLE_MEDIA_STREAM=OFF \
            .. 2>&1 | tail -60
          echo "::endgroup::"
          echo "::group::webkit2gtk ninja (1-2 hr)"
          ninja 2>&1 | tail -80
          echo "::endgroup::"
          ninja install
          ldconfig
          DESTDIR=/opt/cix-stack/webkit ninja install >/dev/null
          pkg-config --modversion webkit2gtk-4.1

      - name: Cache hit — restore /opt/cix-stack into /usr/local (20.04 only)
        if: matrix.distro == 'ubuntu-20.04' && steps.cache-stack.outputs.cache-hit == 'true'
        run: |
          for d in glib libsoup3 webkit; do
            if [ -d /opt/cix-stack/$d ]; then
              cp -a /opt/cix-stack/$d/usr/local/. /usr/local/ 2>/dev/null || true
            fi
          done
          ldconfig
          pkg-config --modversion glib-2.0
          pkg-config --modversion libsoup-3.0
          pkg-config --modversion webkit2gtk-4.1

      # always() 是為了「即使 Tauri build / packaging 後續 fail,webkit 編好的成果也保住」,
      # 但**必須同時要求 webkit 這步真的成功**(build-webkit.outcome == 'success')——
      # 否則 job 在編 webkit 途中被取消 / 失敗時,會把只有 glib+libsoup 的半成品存進快取。
      # 之後每次 cache hit 都會跳過 webkit 編譯卻又找不到它(pkg-config 失敗),
      # 20.04 就此永久卡住,直到有人手動 `gh cache delete`。v0.16.0 發版時實際踩過。
      - name: Save built upstream stack cache (20.04 only)
        if: always() && matrix.distro == 'ubuntu-20.04' && steps.cache-stack.outputs.cache-hit != 'true' && steps.build-webkit.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: /opt/cix-stack
          key: focal-upstream-stack-glib2.78-libsoup3.4-webkit2.42-v1

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # Node 22(對齊 desktop job):vue-i18n 11.4.8 的 engines 要求 `>= 22`,Node 20 會被 yarn 擋下
      # (npm 預設忽略 engines 所以以前沒發現;Node 20 亦已於 2026-04 EOL)。
      # nodesource 用 distro-agnostic 倉庫,Node 22 需 glibc >= 2.28、focal 為 2.31,20.04 亦可裝。
      - name: Setup Node 22
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          # nodesource 的 nodejs 不含 yarn(GitHub 託管 runner 才內建),需自行安裝
          npm i -g yarn
          node --version

      - uses: actions/checkout@v6

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.distro }}

      # --frozen-lockfile:lock 與 package.json 不一致時當場 fail,而非默默改寫 lock。
      # 沒有它,版控 yarn.lock 起不到「可重現建置」的作用 —— 發版產物可能與 repo 內的 lock 不同版。
      - name: Install npm deps
        run: yarn install --frozen-lockfile

      # 20.04 only:系統 focal 套件還是 link 到 /usr/lib glib 2.64(linker -L 順序系統路徑在前)
      # 直接用 /usr/local 編好的覆蓋系統 .so,讓 -lglib-2.0 等找到新版
      - name: Override system glib/soup/webkit with /usr/local (20.04 only)
        if: matrix.distro == 'ubuntu-20.04'
        run: |
          for lib in libglib-2.0 libgobject-2.0 libgio-2.0 libgmodule-2.0 libgthread-2.0 \
                     libsoup-3.0 libjavascriptcoregtk-4.1 libwebkit2gtk-4.1; do
            for f in /usr/local/lib/x86_64-linux-gnu/${lib}.so* /usr/local/lib/${lib}.so*; do
              [ -e "$f" ] && cp -fP "$f" /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
            done
          done
          ldconfig
          echo "===系統 glib 版本(應為 2.78)==="
          ls -l /usr/lib/x86_64-linux-gnu/libglib-2.0.so* | head -5

      - name: Tauri build .deb
        env:
          # tauri.conf.json 有 updater pubkey,build 階段會檢查私鑰存在;
          # 沒設這兩個變數會直接 abort(v0.4.0 三個 distro 都掛在這裡)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --bundles deb

      # Tauri 用 productName(中文)當 .deb Package 名,違反 Debian 規範(只允許小寫
      # 字母 / 數字 / + - .)導致 dpkg -i 拒絕安裝。手動改 control 內 Package 為 ASCII
      # Depends 也依 distro 重寫:20.04 不能列 libwebkit2gtk-4.1-0(focal 無此套件),
      # 22.04+ 走系統 webkit 必須列
      - name: Rewrite .deb Package name + Depends to per-distro
        env:
          DEB_DEPENDS: ${{ matrix.deb_depends }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          VERSION="${TAG_NAME#v}"
          DEB_DIR=src-tauri/target/release/bundle/deb
          ORIG_DEB=$(ls "$DEB_DIR"/*.deb | head -1)
          echo "原始 .deb: $ORIG_DEB (version=$VERSION)"
          WORK=/tmp/deb-fix
          rm -rf "$WORK"
          dpkg-deb -R "$ORIG_DEB" "$WORK"
          echo "=== 原 control ==="
          cat "$WORK/DEBIAN/control"
          sed -i 's/^Package:.*/Package: cix3752i-label-print/' "$WORK/DEBIAN/control"
          sed -i "s/^Depends:.*/Depends: ${DEB_DEPENDS}/" "$WORK/DEBIAN/control"
          echo "=== 新 control ==="
          cat "$WORK/DEBIAN/control"
          NEW_DEB="$DEB_DIR/cix3752i-label-print_${VERSION}_amd64.deb"
          rm -f "$ORIG_DEB"
          dpkg-deb -b "$WORK" "$NEW_DEB"
          ls -lh "$DEB_DIR"

      - name: Package tarball (stack [20.04] + 主程式 .deb + install.sh)
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          DISTRO: ${{ matrix.distro }}
          SOURCE_BUILD: ${{ matrix.source_build }}
        run: |
          set -e
          VERSION="${TAG_NAME#v}"
          STAGE_NAME="cix3752iLabelPrint-${VERSION}-${DISTRO}"
          STAGE="/tmp/${STAGE_NAME}"
          mkdir -p "$STAGE"

          if [ "$SOURCE_BUILD" = "true" ]; then
            # 20.04 — ship 完整 stack(glib 2.78 + libsoup3 + webkit2gtk-4.1)+ runtime .so
            mkdir -p "$STAGE/stack/usr/local"
            for src in /opt/cix-stack/glib /opt/cix-stack/libsoup3 /opt/cix-stack/webkit; do
              if [ -d "$src/usr/local" ]; then
                cp -a "$src/usr/local/." "$STAGE/stack/usr/local/"
              fi
            done
            # 從 build container 抓 runtime .so + libstdc++(GCC11 版,focal 預設缺 GLIBCXX_3.4.29)
            # 用 ldconfig -p 找實際路徑(handle symlink + 真檔的差別)
            mkdir -p "$STAGE/stack/usr/local/lib/x86_64-linux-gnu"
            for soname in \
                libxslt.so.1 libwoff2dec.so.1.0.2 libwoff2common.so.1.0.2 \
                libharfbuzz-icu.so.0 libopenjp2.so.7 libwebpdemux.so.2 \
                libenchant-2.so.2 libsecret-1.so.0 libhyphen.so.0 \
                libgbm.so.1 libdrm.so.2 libnghttp2.so.14 libatomic.so.1 \
                libwayland-server.so.0 libstdc++.so.6; do
              real=$(ldconfig -p 2>/dev/null | awk -v s="$soname" '$1==s{print $NF; exit}')
              if [ -n "$real" ] && [ -e "$real" ]; then
                cp -P "$real" "$STAGE/stack/usr/local/lib/x86_64-linux-gnu/"
                actual=$(readlink -f "$real")
                [ "$actual" != "$real" ] && cp "$actual" "$STAGE/stack/usr/local/lib/x86_64-linux-gnu/"
                if [ "$real" != "$actual" ]; then
                  base=$(basename "$actual")
                  (cd "$STAGE/stack/usr/local/lib/x86_64-linux-gnu/" && ln -sf "$base" "$soname" 2>/dev/null || true)
                fi
              else
                echo "WARN: $soname not found via ldconfig"
              fi
            done
            du -sh "$STAGE/stack" || true
            echo "=== sanity:核心 .so ==="
            ls "$STAGE/stack/usr/local/lib/x86_64-linux-gnu/" | grep -E "libwebkit2gtk-4\.1|libsoup-3\.0|libstdc\+\+|libxslt|libgbm" | head
          else
            # 22.04 / 24.04 — 不 ship stack,系統有 webkit2gtk-4.1
            echo "走系統 webkit2gtk-4.1,不打包 stack/"
          fi

          # 主程式 .deb(Tauri build 出來,已 rewrite Package + Depends)
          cp src-tauri/target/release/bundle/deb/*.deb "$STAGE/"
          ls "$STAGE/"

          # install.sh:依 SOURCE_BUILD 動態生(20.04 三步;22.04+ 兩步走 apt)
          if [ "$SOURCE_BUILD" = "true" ]; then
            cat > "$STAGE/install.sh" <<'INSTALL_EOF'
          #!/bin/bash
          set -e
          cd "$(dirname "$0")"

          echo "=== 智配通 面單列印 — Ubuntu 20.04 安裝 ==="
          echo ""
          echo "1/3 複製 webkit2gtk-4.1 / libsoup3 / glib 2.78 → /usr/local"
          if [ -d stack/usr/local ]; then
            sudo cp -a stack/usr/local/. /usr/local/
          fi

          echo "2/3 更新 dynamic linker cache"
          # 00- 前綴讓字母順序排在 /etc/ld.so.conf.d 內系統 conf 之前,
          # 確保 ldconfig 優先索引 /usr/local 的 .so(而非系統的舊版)
          # 含 multiarch 子目錄(x86_64-linux-gnu),否則 .so 不會被 cache
          sudo tee /etc/ld.so.conf.d/00-cix3752iLabelPrint.conf > /dev/null <<'LDCONF'
          /usr/local/lib/x86_64-linux-gnu
          /usr/local/lib
          LDCONF
          sudo ldconfig

          echo "3/3 安裝主程式 .deb"
          sudo dpkg -i *.deb || sudo apt-get install -f -y

          echo ""
          echo "=== 完成 ==="
          echo "從應用選單開啟「智配通 面單列印」,或於 terminal 執行:cix3752i-label-print"
          INSTALL_EOF
          else
            cat > "$STAGE/install.sh" <<INSTALL_EOF
          #!/bin/bash
          set -e
          cd "\$(dirname "\$0")"

          echo "=== 智配通 面單列印 — ${DISTRO} 安裝 ==="
          echo ""
          echo "1/2 透過 apt 安裝主程式與系統依賴(webkit2gtk-4.1 / gtk-3 / appindicator3)"
          # 用 apt install ./*.deb 讓 apt 自動解 Depends 並從套件源拉缺失的 lib
          sudo apt-get update
          sudo apt-get install -y ./\$(ls *.deb | head -1)

          echo "2/2 完成"
          echo ""
          echo "從應用選單開啟「智配通 面單列印」,或於 terminal 執行:cix3752i-label-print"
          INSTALL_EOF
          fi
          chmod +x "$STAGE/install.sh"

          # README — 依 distro 動態
          if [ "$SOURCE_BUILD" = "true" ]; then
            cat > "$STAGE/README.txt" <<'README_EOF'
          智配通 面單列印 — Ubuntu 20.04 離線安裝包
          =========================================

          內含:
            - stack/usr/local/         自編的 glib 2.78 + libsoup3 + webkit2gtk-4.1
                                       (Ubuntu 20.04 套件源無此版本,我們從 source build)
            - 主程式 .deb              cix3752i-label-print
            - install.sh

          安裝(可在離線環境執行):
            sudo bash install.sh

          後續升級:
            只需 sudo dpkg -i <新版主程式.deb>(webkit 已在系統內,不必重裝)
          README_EOF
          else
            cat > "$STAGE/README.txt" <<README_EOF
          智配通 面單列印 — ${DISTRO} 安裝包
          ===============================================

          內含:
            - 主程式 .deb              cix3752i-label-print
            - install.sh

          安裝(需要網路,apt 會自動解 webkit2gtk-4.1 等系統依賴):
            sudo bash install.sh

          後續升級:
            sudo dpkg -i <新版主程式.deb>(或 sudo apt install ./<新版.deb>)
          README_EOF
          fi

          # 打 tarball
          cd /tmp
          tar czf "${STAGE_NAME}.tar.gz" "${STAGE_NAME}"
          ls -lh "${STAGE_NAME}.tar.gz"

          echo "TARBALL=/tmp/${STAGE_NAME}.tar.gz" >> $GITHUB_ENV

      # release 已由前置的 create-release job 統一建立(含 body),這個 job 只負責把 tarball
      # 上傳成 asset,不再需要自己產生/帶 release notes,原本的「Build release notes」步驟移除。
      #
      # 改用 release id 直接打 uploads.github.com,不再用 softprops/action-gh-release ——
      # 原本 softprops 遇到「找不到該 tag 的 release」也會自己建一個,跟 release-desktop
      # (tauri-action)同時搶著建,就是 v0.17.1 炸出兩個同 tag draft 的根因(見 create-release
      # job 開頭註解)。現在 release 一律由 create-release 先建好,這裡只認 release id 上傳資產。
      #
      # 不能用 gh release upload <tag> 或 tag 定位 API —— draft release 沒有真正指到 tag 的
      # ref,實測用 tag 定位會 404;改用 release id 打 REST API 才穩定命中,這也是 tauri-action
      # 內部上傳 asset 用的同一種定位方式。
      #
      # 這裡刻意只用 curl + node,不用 gh CLI —— 這個 job 的 steps 是跑在 ubuntu:20.04/22.04/24.04
      # 官方 container image 裡(job 層級 `container:`),不是 GitHub-hosted runner 本體,container
      # 內沒有預裝 gh。node 則保證已裝(上面「Setup Node 22」對三個 distro 都是無條件跑),
      # 用它的內建 JSON.parse 就夠解析 API 回應,不必為了這步另外去動 apt bootstrap 多裝套件。
      - name: Upload tarball to Release
        # 這個 job 跑在 `container:` 裡,GitHub 對 container job 的預設 shell 是 `sh -e {0}`
        # (dash),不是 runner 本體的 bash。dash 沒有 `set -o pipefail`,寫了會直接
        # 「Illegal option -o pipefail」退出 2,整步失敗 —— 這步要用 bash 語法就必須明寫
        # shell: bash(ubuntu 官方 image 一定有 /bin/bash)。
        # 注意只指定這一步:GitHub 的 shell: bash 預設帶 -eo pipefail,而本 job 其他步驟有
        # 多處 `... | head -N`,在 pipefail 下上游會因 SIGPIPE(141)讓整條 pipeline 判定失敗。
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          # 這步本身沒有 pipe,pipefail 是預留給日後在這裡加 pipe 的人,避免中間指令失敗被吞掉。
          set -euo pipefail
          ASSET_NAME=$(basename "$TARBALL")
          API_BASE="https://api.github.com/repos/${{ github.repository }}"
          echo "上傳 $ASSET_NAME 到 release id=$RELEASE_ID"

          # 同名 asset 已存在(重跑 workflow 補傳同一個 distro)要先刪除再傳,
          # GitHub upload API 對同名 asset 會直接回 422,不會自動覆蓋
          curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${API_BASE}/releases/${RELEASE_ID}/assets?per_page=100" -o /tmp/existing-assets.json

          EXISTING_ASSET_ID=$(node -e "
            const fs = require('fs');
            const assets = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const found = assets.find((a) => a.name === process.argv[2]);
            if (found) process.stdout.write(String(found.id));
          " /tmp/existing-assets.json "$ASSET_NAME")

          if [ -n "$EXISTING_ASSET_ID" ]; then
            echo "同名 asset 已存在(id=$EXISTING_ASSET_ID),先刪除再重傳"
            curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              "${API_BASE}/releases/assets/${EXISTING_ASSET_ID}"
          fi

          HTTP_STATUS=$(curl -sS -o /tmp/upload-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${TARBALL}" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}")

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::上傳失敗,HTTP $HTTP_STATUS"
            cat /tmp/upload-response.json
            exit 1
          fi
          echo "上傳成功(HTTP $HTTP_STATUS)"

  # 驗收 release asset 是否到齊 —— release-linux 帶 continue-on-error: true(讓單一 distro
  # 掛掉不阻其他 matrix),代價是「Linux 三個全掛、整個 run 仍是綠燈」:v0.19.0 就是三個
  # tarball 全部沒上傳卻顯示 success,只能靠人工去看 annotations 才發現;沒發現就會直接
  # `gh release edit --draft=false` 公開一個沒有 Linux 版的 release。
  #
  # 刻意不看 needs.*.result —— continue-on-error 的 job 失敗後,傳給 needs 的結果仍是
  # success,看 result 驗不到任何東西。這裡直接查 release 上實際有哪些 asset,少一項就紅燈:
  # 驗的是「產物在不在」,不是「job 綠不綠」。
  verify-assets:
    needs: [create-release, release-desktop, release-linux]
    # always():只跑 linux 或只跑 desktop 時,另一邊是 skipped,不能讓它擋掉驗收。
    # create-release 失敗時沒有 release id 可驗,那才真的跳過。
    if: always() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          ONLY: ${{ github.event.inputs.only || 'all' }}
        run: |
          set -euo pipefail
          # comm 要求兩份清單同一套排序規則,固定 C locale 避免 runner locale 影響比對
          export LC_ALL=C
          VERSION="${TAG_NAME#v}"
          echo "驗收 tag=$TAG_NAME(版本 $VERSION)、release id=$RELEASE_ID、範圍 only=$ONLY"

          : > /tmp/expected.txt

          if [ "$ONLY" != "linux" ]; then
            # 這組名稱由 tauri-action 依 assetNamePattern 展開(arch 來自 matrix.target),
            # 不是本 workflow 自己組的字串,無法從 matrix 機械推導,只能寫明。
            # 動 release-desktop 的 matrix 或 assetNamePattern 時要同步改這裡。
            {
              echo "cix3752iLabelPrint_${VERSION}_aarch64.dmg"
              echo "cix3752iLabelPrint_${VERSION}_aarch64.app.tar.gz"
              echo "cix3752iLabelPrint_${VERSION}_aarch64.app.tar.gz.sig"
              echo "cix3752iLabelPrint_${VERSION}_x64_setup.exe"
              echo "cix3752iLabelPrint_${VERSION}_x64_setup.exe.sig"
              echo "latest.json"
            } >> /tmp/expected.txt
          fi

          if [ "$ONLY" != "desktop" ]; then
            # Linux tarball 名稱是本 workflow 自己組的(cix3752iLabelPrint-{版本}-{distro}.tar.gz);
            # distro 由腳本從 release-linux 的 matrix 解析,不在這裡另抄一份清單 ——
            # 日後增減 distro 驗收會自動跟上,不會兩邊漂移。解析失敗時腳本以非 0 退出,
            # 在 pipefail 下當場擋下,不會退化成「沒有東西要檢查」而靜默通過。
            python3 scripts/list-linux-distros.py \
              | sed "s|^|cix3752iLabelPrint-${VERSION}-|; s|$|.tar.gz|" >> /tmp/expected.txt
          fi

          sort -u /tmp/expected.txt -o /tmp/expected.txt
          gh api --paginate "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[].name' | sort > /tmp/actual.txt

          echo "--- release 上實際的 asset ---"
          cat /tmp/actual.txt
          echo "--- 本次應到齊的 asset ---"
          cat /tmp/expected.txt

          MISSING=$(comm -23 /tmp/expected.txt /tmp/actual.txt)
          if [ -n "$MISSING" ]; then
            echo "::error::release 缺少下列 asset,補齊前不要公開這個 release"
            echo "$MISSING" | sed 's|^|  缺少:|'
            echo "補救方式:到 Actions 頁面手動觸發 Release,tag 填 $TAG_NAME,only 選缺的那一邊(linux / desktop)"
            exit 1
          fi
          echo "asset 到齊,共 $(wc -l < /tmp/expected.txt | tr -d ' ') 項"
