[package]
name = "cix3752i-label-print"
version = "0.19.0"
description = "本地分揀中介服務與面單列印桌面工具"
authors = ["豬隊友"]
edition = "2021"
default-run = "cix3752i-label-print"
# sqlx 0.9 要求 1.94(其相依 sqlx-core / sqlx-macros 同樣)
rust-version = "1.94"

[lib]
name = "cix3752i_label_print_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 防止重複啟動:第二個實例只聚焦既有視窗後正常退出,不再因搶不到 18080 而整個 App panic
tauri-plugin-single-instance = "2"

# Async / web server
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "fs", "trace", "limit"] }
hyper = "1"

# HTTP client
# 0.13 起 rustls-tls 改名為 rustls;query(?a=b 參數)也從內建拆成獨立 feature
reqwest = { version = "0.13", features = ["json", "stream", "rustls", "query"], default-features = false }

# WebSocket client(件數核對跨機同步:訂閱 Reverb/Pusher 廣播)
# 用 ring provider 對齊既有 reqwest/sqlx 的 rustls(避免 aws-lc-rs 雙 provider 衝突)
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Database
# 0.9 把 runtime-tokio-rustls 拆成「執行 runtime」與「TLS 實作」兩個 feature
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "macros", "migrate"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Misc
once_cell = "1"
parking_lot = "0.12"
local-ip-address = "0.6"
futures = "0.3"
async-trait = "0.1"
url = "2"
mime_guess = "2"
# v4 的 default(= v1 feature)本來就含三個平台的原生 store
# (macOS keychain / Windows / Linux secret-service),不必再逐一指定 ——
# 但也不能改成 default-features = false,那會退回沒有任何 store 可用。
keyring = { version = "4" }

# 本機印表機（跨平台）
printers = "2"
image = "0.25"
# 0.27 起文字繪製(text_size / draw_text_mut)拆成 text feature,而 default-features 是關掉的 ——
# 不補這個 feature 會編不過。維持關閉 default 的原意:不拉進 rayon / fft / sdl2 等用不到的重相依。
imageproc = { version = "0.27", default-features = false, features = ["text"] }
ab_glyph = "0.2"

# USB / 視訊裝置擷取(跨平台:macOS AVFoundation / Windows MSMF / Linux V4L2)
# 用於「收到工控機請求即抓讀碼站當下畫面」做為沒貨卻出紙的存證
nokhwa = { version = "0.10", features = ["input-native"] }
base64 = "0.23"
barcoders = "2"

# macOS Dock 名稱:dev binary 沒 .app bundle,embed_plist 把最小 Info.plist
# 編譯期內嵌進 __TEXT,__info_plist section;production .app 仍用 bundle 內 plist 不受影響
[target.'cfg(target_os = "macos")'.dependencies]
embed_plist = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
