[package]
name = "cix3752i-label-print"
version = "0.13.0"
description = "本地分揀中介服務與面單列印桌面工具"
authors = ["豬隊友"]
edition = "2021"
default-run = "cix3752i-label-print"
rust-version = "1.77"

[lib]
name = "cix3752i_label_print_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 防止重複啟動:第二個實例只聚焦既有視窗後正常退出,不再因搶不到 18080 而整個 App panic
tauri-plugin-single-instance = "2"

# Async / web server
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "limit"] }
hyper = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# WebSocket client(件數核對跨機同步:訂閱 Reverb/Pusher 廣播)
# 用 ring provider 對齊既有 reqwest/sqlx 的 rustls(避免 aws-lc-rs 雙 provider 衝突)
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "macros", "migrate"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Misc
once_cell = "1"
parking_lot = "0.12"
local-ip-address = "0.6"
futures = "0.3"
async-trait = "0.1"
url = "2"
mime_guess = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# 本機印表機（跨平台）
printers = "2"
image = "0.25"
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"

# USB / 視訊裝置擷取(跨平台:macOS AVFoundation / Windows MSMF / Linux V4L2)
# 用於「收到工控機請求即抓讀碼站當下畫面」做為沒貨卻出紙的存證
nokhwa = { version = "0.10", features = ["input-native"] }
base64 = "0.22"
barcoders = "1"

# macOS Dock 名稱:dev binary 沒 .app bundle,embed_plist 把最小 Info.plist
# 編譯期內嵌進 __TEXT,__info_plist section;production .app 仍用 bundle 內 plist 不受影響
[target.'cfg(target_os = "macos")'.dependencies]
embed_plist = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
